[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volume-monitor"
version = "1.0.3"
description = "BitFocus Companion Volume & Device Monitor for PipeWire"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Tech127x"}
]
keywords = ["audio", "stream-deck", "companion", "pipewire", "volume", "cachyos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Mixers",
    "Topic :: Utilities",
]

requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.10",
    "black>=23.0",
    "ruff>=0.1.3",
    "mypy>=1.0",
    "pre-commit>=3.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
]

[project.scripts]
volume-monitor = "volume_monitor.cli:main"
volume-monitor-config = "volume_monitor.cli_utils:interactive_configure"

[project.urls]
Homepage = "https://github.com/Tech127x/volume-monitor"
Documentation = "https://github.com/Tech127x/volume-monitor/wiki"
Issues = "https://github.com/Tech127x/volume-monitor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
src = ["src"]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
# disallow_untyped_defs = true  # Enable after full typing

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=volume_monitor --cov-report=term"
